name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire GestionnaireUltra.zip
        run: unzip -o GestionnaireUltra.zip -d .

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Générer le wrapper Gradle
        working-directory: GestionnaireUltra
        run: gradle wrapper --gradle-version 8.7

      - name: Rendre gradlew exécutable
        working-directory: GestionnaireUltra
        run: chmod +x gradlew

      - name: Compiler l'APK
        working-directory: GestionnaireUltra
        run: ./gradlew assembleDebug

      - name: Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: gestionnaire-ultra-apk
          path: GestionnaireUltra/app/build/outputs/apk/debug/app-debug.apk
