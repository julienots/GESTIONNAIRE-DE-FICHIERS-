name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Compiler l'APK Ultra Fichiers
        working-directory: UltraFichiers
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ultra-fichiers-apk
          path: UltraFichiers/app/build/outputs/apk/release/app-release.apk
